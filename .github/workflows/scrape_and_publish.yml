name: Automated Web Scraper & Periodic Updater

on:
  schedule:
    # Run automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Pre-installed Chrome
        run: |
          google-chrome --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database & Run Dynamic Scraper
        run: |
          python cli.py init-db
          # Scrape dynamic infinite scroll quotes
          python cli.py scrape "https://quotes.toscrape.com/scroll" --parser ecommerce --wait-for ".quote" --scroll 2
          # Scrape book catalog
          python cli.py scrape "http://books.toscrape.com/" --parser ecommerce --wait-for "article.product_pod"

      - name: Export Fresh Data to Web Dashboard
        run: |
          python cli.py export --format json --output docs/data.json
          python cli.py export --format csv --output docs/data.csv

      - name: Commit and push updated datasets to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data.csv
          if git diff --staged --quiet; then
            echo "No changes in datasets to commit."
          else
            git commit -m "chore(data): automated periodic scrape update [skip ci]"
            git push
          fi
